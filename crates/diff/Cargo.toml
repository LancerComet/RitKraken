[package]
name = "ritkraken-diff"
version.workspace = true
edition.workspace = true
publish = false

[lib]
test = false
doctest = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-base = "=0.9.0"
gpui-component = { version = "=0.9.0", features = ["syntect"] }
ritkraken-git = { path = "../git" }
ropey = "=2.0.0-beta.1"
rust-i18n = "4.2"
similar = { version = "2.7", features = ["unicode"] }
smallvec = "1"
syntect = { version = "5.3", default-features = false }
two-face = { version = "0.4.5", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"

[build-dependencies]
serde_json = "1"
