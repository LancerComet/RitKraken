[package]
name = "ritkraken"
version.workspace = true
edition.workspace = true

[dependencies]
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = ["rustls-tls-native-roots"] }
ritkraken-diff = { path = "../diff" }
ritkraken-git = { path = "../git" }
rust-i18n = "4.2"
serde_json = "1"
sha2 = "0.11"
smallvec = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
unicase = "2.10"
unicode-segmentation = "1"

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
