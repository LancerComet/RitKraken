[package]
name = "ritkraken"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = { version = "=0.9.0", features = ["gpui-fast", "syntect"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = ["rustls-tls-native-roots"] }
ritkraken-diff = { path = "../diff" }
ritkraken-git = { path = "../git" }
rust-i18n = "4.2"
serde_json = "1"
sha2 = "0.11"
smallvec = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
unicase = "2.10"
unicode-segmentation = "1"

[build-dependencies]
serde_json = "1"

[target.'cfg(any(windows, target_os = "macos"))'.build-dependencies]
resvg = "=0.45.1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"
image = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "=0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSView", "objc2-quartz-core"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CALayer", "CATransaction", "objc2-core-foundation"] }
