<svg xmlns="http://www.w3.org/2000/svg" viewBox="37 38 432 432" width="512" height="512">
  <!--
    Colours and shading follow the reference image, sampled per pixel:
      teal        #2A7B8E, glowing to #30A4AE at the bottom of each disc
      slate       #3E435A (flat)
      shaded teal #32657A to #395268 where an upper piece covers an arm
      hole        #FFFFFF
  -->
  <defs>
    <!-- Head: flat teal with a wide glow rising from the bottom edge -->
    <radialGradient id="head" gradientUnits="userSpaceOnUse" cx="256" cy="296" r="130"
        gradientTransform="translate(256 296) scale(1.6 1) translate(-256 -296)">
      <stop offset=".046" stop-color="#30A4AE"/>
      <stop offset=".18" stop-color="#2C9AA6"/>
      <stop offset=".285" stop-color="#2C93A1"/>
      <stop offset=".39" stop-color="#2B8C9B"/>
      <stop offset=".5" stop-color="#2A7F91"/>
      <stop offset=".73" stop-color="#2A7C8F"/>
      <stop offset="1" stop-color="#2A7B8E"/>
    </radialGradient>

    <!-- Nodes: the same bottom glow -->
    <linearGradient id="nodeL" gradientUnits="userSpaceOnUse" x1="152" y1="357" x2="152" y2="465">
      <stop offset="0" stop-color="#2A7B8E"/>
      <stop offset=".25" stop-color="#2A8092"/>
      <stop offset=".76" stop-color="#2B8F9D"/>
      <stop offset=".91" stop-color="#2C95A3"/>
      <stop offset="1" stop-color="#2C99A6"/>
    </linearGradient>
    <linearGradient id="nodeR" gradientUnits="userSpaceOnUse" x1="354" y1="308" x2="354" y2="416">
      <stop offset=".06" stop-color="#2A7B8E"/>
      <stop offset=".2" stop-color="#2A7C8F"/>
      <stop offset=".73" stop-color="#2B919F"/>
      <stop offset=".8" stop-color="#2C99A6"/>
      <stop offset=".88" stop-color="#2CA1AC"/>
      <stop offset="1" stop-color="#30A4AE"/>
    </linearGradient>

    <!-- Tail: shaded by the right node above it -->
    <radialGradient id="tail" gradientUnits="userSpaceOnUse" cx="354" cy="362" r="95">
      <stop offset=".5" stop-color="#3A4F65"/>
      <stop offset=".58" stop-color="#385469"/>
      <stop offset=".65" stop-color="#355B70"/>
      <stop offset=".73" stop-color="#326478"/>
      <stop offset=".87" stop-color="#2C7689"/>
      <stop offset="1" stop-color="#2A7B8E"/>
    </radialGradient>

    <!-- Shade the head casts on both arms -->
    <radialGradient id="headShade" gradientUnits="userSpaceOnUse" cx="256" cy="170" r="190">
      <stop offset=".63" stop-color="#3E435A" stop-opacity=".78"/>
      <stop offset=".69" stop-color="#3E435A" stop-opacity=".7"/>
      <stop offset=".74" stop-color="#3E435A" stop-opacity=".5"/>
      <stop offset=".81" stop-color="#3E435A" stop-opacity=".3"/>
      <stop offset=".91" stop-color="#3E435A" stop-opacity=".1"/>
      <stop offset="1" stop-color="#3E435A" stop-opacity="0"/>
    </radialGradient>

    <path id="armPath" d="M152 411V330A101 101 0 0 1 354 330V362"/>
    <mask id="armMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <use href="#armPath" fill="none" stroke="#fff" stroke-width="72" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Tail behind the right node -->
  <path d="M354 362V430" fill="none" stroke="url(#tail)" stroke-width="72" stroke-linecap="round"/>

  <!-- Arms -->
  <use href="#armPath" fill="none" stroke="#2A7B8E" stroke-width="72" stroke-linecap="round"/>
  <circle cx="256" cy="170" r="190" fill="url(#headShade)" mask="url(#armMask)"/>

  <!-- Nodes -->
  <circle cx="354" cy="362" r="54" fill="url(#nodeR)"/>
  <circle cx="354" cy="362" r="23" fill="#3E435A"/>
  <circle cx="152" cy="411" r="54" fill="url(#nodeL)"/>
  <circle cx="152" cy="411" r="23" fill="#3E435A"/>

  <!-- Head -->
  <circle cx="256" cy="170" r="128" fill="url(#head)"/>
  <circle cx="256" cy="170" r="70" fill="#3E435A"/>
  <circle cx="256" cy="170" r="33" fill="#FFFFFF"/>
</svg>
